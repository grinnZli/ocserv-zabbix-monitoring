# ==========================================
# OpenConnect VPN (ocserv) Monitoring
# Zabbix Agent 2 UserParameters
# ==========================================

# --- General server metrics ---
UserParameter=ocserv.active_sessions,/etc/zabbix/scripts/ocserv_stats.sh active_sessions
UserParameter=ocserv.total_sessions,/etc/zabbix/scripts/ocserv_stats.sh total_sessions
UserParameter=ocserv.auth_failures,/etc/zabbix/scripts/ocserv_stats.sh auth_failures
UserParameter=ocserv.ips_banned,/etc/zabbix/scripts/ocserv_stats.sh ips_banned
UserParameter=ocserv.uptime_start,/etc/zabbix/scripts/ocserv_stats.sh uptime_start
UserParameter=ocserv.uptime_seconds,/etc/zabbix/scripts/ocserv_stats.sh uptime_seconds
UserParameter=ocserv.traffic_in,/etc/zabbix/scripts/ocserv_stats.sh traffic_in
UserParameter=ocserv.traffic_out,/etc/zabbix/scripts/ocserv_stats.sh traffic_out

# --- User metrics (LLD) ---
UserParameter=ocserv.user.discovery,/etc/zabbix/scripts/ocserv_stats.sh user_list
UserParameter=ocserv.user.status[*],/etc/zabbix/scripts/ocserv_stats.sh user_status "$1"
UserParameter=ocserv.user.traffic_in[*],/etc/zabbix/scripts/ocserv_stats.sh user_traffic_in "$1"
UserParameter=ocserv.user.traffic_out[*],/etc/zabbix/scripts/ocserv_stats.sh user_traffic_out "$1"
UserParameter=ocserv.user.remote_ip[*],/etc/zabbix/scripts/ocserv_stats.sh user_remote_ip "$1"
UserParameter=ocserv.user.user_agent[*],/etc/zabbix/scripts/ocserv_stats.sh user_user_agent "$1"
UserParameter=ocserv.user.hostname[*],/etc/zabbix/scripts/ocserv_stats.sh user_hostname "$1"
UserParameter=ocserv.user.connected_at[*],/etc/zabbix/scripts/ocserv_stats.sh user_connected_at "$1"

# --- Banned IP metrics (LLD) ---
UserParameter=ocserv.ban.discovery,/etc/zabbix/scripts/ocserv_stats.sh ban_list
UserParameter=ocserv.ban.status[*],/etc/zabbix/scripts/ocserv_stats.sh ban_status "$1"
